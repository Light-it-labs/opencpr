<!doctype html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta
      name="format-detection"
      content="telephone=no,address=no,email=no,date=no,url=no"
    />
    <style>
      @media screen and (max-width: 600px) {
        .container {
          width: 100% !important;
        }
        .p-sm {
          padding-left: 16px !important;
          padding-right: 16px !important;
        }
        .center-sm {
          text-align: center !important;
        }
      }
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      width: 100% !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      background-color: #F3EFE6;
    "
  >
    <center
      role="article"
      aria-roledescription="email"
      lang="en"
      style="width: 100%; background-color: #F3EFE6"
    >
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="100%"
        style="border-collapse: collapse"
      >
        <tr>
          <td align="center" style="padding: 24px 12px">
            <!-- Rounded container -->
            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              border="0"
              width="600"
              class="container"
              style="
                width: 600px;
                max-width: 600px;
                background-color: #FBF9F4;
                border: 1px solid #E1DACB;
                border-radius: 22px;
                overflow: hidden;
              "
            >
              <tr>
                <td class="p-sm" style="padding: 24px 32px 16px 32px">
                  <p
                    style="
                      margin: 0 0 12px 0;
                      font-family:
                        "Funnel Sans",
                        "Avenir Next",
                        "Segoe UI",
                        Arial,
                        sans-serif;
                      font-size: 16px;
                      color: #2A171B;
                    "
                  >
                    Hi <strong style="color: #B23A2E">{{recipientName}}</strong>,
                  </p>
                  <p
                    style="
                      margin: 0 0 12px 0;
                      font-family:
                        "Funnel Sans",
                        "Avenir Next",
                        "Segoe UI",
                        Arial,
                        sans-serif;
                      font-size: 16px;
                      color: #2A171B;
                    "
                  >
                    {{intro}}
                  </p>
                  <p
                    style="
                      margin: 0 0 12px 0;
                      font-family:
                        "Funnel Sans",
                        "Avenir Next",
                        "Segoe UI",
                        Arial,
                        sans-serif;
                      font-size: 16px;
                      color: #2A171B;
                    "
                  >
                    Knowing CPR stays with you. And when it counts, it is what
                    separates the bystander from the one who acts.
                  </p>
                  <p
                    style="
                      margin: 0 0 12px 0;
                      font-family:
                        "Funnel Sans",
                        "Avenir Next",
                        "Segoe UI",
                        Arial,
                        sans-serif;
                      font-size: 16px;
                      color: #2A171B;
                    "
                  >
                    {{resultsNote}}
                  </p>

                  <!--
                    Capped explicitly: the card is rendered at its own natural
                    width, which is wider than this 600px container, and an
                    uncapped img stretches the whole table and clips the copy.
                  -->
                  <img
                    src="cid:challenge-results"
                    alt="Your CPR challenge results"
                    width="536"
                    style="
                      display: block;
                      border: 0;
                      outline: none;
                      text-decoration: none;
                      margin: 20px 0;
                      border-radius: 8px;
                      width: 100%;
                      max-width: 536px;
                      height: auto;
                    "
                  />

                  <p
                    style="
                      margin: 16px 0 0 0;
                      font-family:
                        "Funnel Sans",
                        "Avenir Next",
                        "Segoe UI",
                        Arial,
                        sans-serif;
                      font-size: 16px;
                      color: #2A171B;
                    "
                  >
                    Thanks for giving a few minutes to something that, when it
                    counts, can save a life!
                  </p>
                  <p
                    style="
                      margin: 8px 0 0 0;
                      font-family:
                        "Funnel Sans",
                        "Avenir Next",
                        "Segoe UI",
                        Arial,
                        sans-serif;
                      font-size: 16px;
                      color: #2A171B;
                    "
                  >
                    The OpenCPR team
                  </p>
                </td>
              </tr>
            </table>
            <!--/ container -->
            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              border="0"
            >
              <tr>
                <td align="center" style="padding: 24px 0 24px 0">
                  <!--
                    Dark ink on transparent: it reads on the cream ground and
                    on a client that recolors the message alike.
                  -->
                  <img
                    src="cid:logo"
                    width="180"
                    alt="OpenCPR"
                    style="
                      display: block;
                      border: 0;
                      outline: none;
                      text-decoration: none;
                      width: 180px;
                      max-width: 100%;
                      height: auto;
                      margin: 0 auto;
                    "
                  />
                </td>
              </tr>
            </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </center>
  </body>
</html>
