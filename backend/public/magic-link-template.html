<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to the OpenCPR admin</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px 12px;
      background-color: #F3EFE6;
      font-family: "Funnel Sans", "Avenir Next", "Segoe UI", Arial, sans-serif;
      color: #2A171B;
    "
  >
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="
        max-width: 480px;
        margin: 0 auto;
        background-color: #FBF9F4;
        border: 1px solid #E1DACB;
        border-radius: 22px;
      "
    >
      <tr>
        <td style="padding: 32px 28px">
          <h1 style="margin: 0 0 16px; font-size: 22px">
            Sign in to the OpenCPR admin
          </h1>
          <p style="margin: 0 0 24px; font-size: 15px; line-height: 22px">
            Use the button below to sign in. The link expires in
            {{ttlMinutes}} minutes and can only be used once.
          </p>
          <a
            href="{{url}}"
            style="
              display: inline-block;
              padding: 12px 24px;
              background-color: #B23A2E;
              color: #ffffff;
              font-size: 15px;
              font-weight: bold;
              text-decoration: none;
              border-radius: 999px;
            "
            >Sign in</a
          >
          <p
            style="
              margin: 24px 0 0;
              font-size: 13px;
              line-height: 20px;
              color: #6E5559;
              word-break: break-all;
            "
          >
            If the button does not work, copy this address into your browser:
            <br />{{url}}
          </p>
          <p
            style="
              margin: 24px 0 0;
              font-size: 13px;
              line-height: 20px;
              color: #6E5559;
            "
          >
            If you did not request this, you can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
