<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Why the sensor travels further than the chest</title>
  <desc id="desc">Side view of the manikin. A hinged chest plate pivots on the left above a flat base. A large compression spring stands on the base under the sternum, part-way along the plate, so there is no room for a sensor there; the VL53L4CD sensor sits on the underside further from the hinge, pointing straight down at the base. The plate is drawn at rest and pressed: a 50 mm compression at the sternum swings the sensor 65 mm, because sensor travel equals chest depth times the hinge-to-sensor distance divided by the hinge-to-sternum distance, 1.3 with the reference mount.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L9 5 1 9z" fill="#B23A2E"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L9 5 1 9z" fill="#6E5559"/>
    </marker>
  </defs>
  <style>
    text { font-family: Gabarito, "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #2A171B; }
    .title { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { font-size: 15px; fill: #6E5559; }
    .lane { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; fill: #9C8689; }
    .group { fill: #FBF9F4; stroke: #E1DACB; stroke-width: 1.5; }
    .box { fill: #FFFFFF; stroke: #E1DACB; stroke-width: 1.5; }
    .h { font-size: 19px; font-weight: 700; }
    .k { font-size: 13px; font-weight: 700; }
    .p { font-size: 14px; fill: #6E5559; }
    .p-light { font-size: 13px; fill: #E8D9D6; }
    .pill { fill: #F7E2DD; }
    .pill-t { font-size: 12.5px; font-weight: 700; fill: #B23A2E; }
    .flow { fill: none; stroke: #B23A2E; stroke-width: 2; }
    .dim { fill: none; stroke: #B23A2E; stroke-width: 1.5; }
    .flow-soft { fill: none; stroke: #6E5559; stroke-width: 2; stroke-dasharray: 6 5; }
    .beam { fill: none; stroke: #6E5559; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ext { fill: none; stroke: #6E5559; stroke-width: 1; }
    .lbl { font-size: 13px; font-weight: 700; fill: #B23A2E; text-anchor: middle; }
    .lbl-sub { font-size: 12.5px; fill: #6E5559; text-anchor: middle; }
    .plate { stroke: #2A171B; stroke-width: 6; stroke-linecap: round; }
    .plate-pressed { stroke: #6E5559; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 10 7; }
    .spring { fill: none; stroke: #6E5559; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .sensor { fill: #FFFFFF; stroke: #B23A2E; stroke-width: 1.5; }
    .sensor-pressed { fill: #FFFFFF; stroke: #6E5559; stroke-width: 1.5; stroke-dasharray: 3 3; }
  </style>

  <rect width="1100" height="560" fill="#F3EFE6"/>

  <text x="48" y="58" class="title">Why the sensor travels further than the chest</text>
  <text x="48" y="84" class="subtitle">Side view. The chest plate pivots at the hinge; the sensor sits further out than the sternum, so the same swing moves it further.</text>
  <g transform="translate(1010 36)" aria-hidden="true">
    <rect x="8.5" y="5" width="14" height="24" rx="7" fill="#C8372D" transform="rotate(-45 15.5 17)"/>
    <rect x="17.5" y="5" width="14" height="24" rx="7" fill="#F2A79E" transform="rotate(45 24.5 17)"/>
  </g>

  <!-- Dimension lines along the plate, measured from the hinge -->
  <path class="dim" d="M180 126 L180 138 M180 132 L700 132 M700 126 L700 138"/>
  <text x="440" y="124" class="lbl">hinge → sensor</text>
  <path class="dim" d="M180 164 L180 176 M180 170 L580 170 M580 164 L580 176"/>
  <text x="380" y="162" class="lbl">hinge → sternum</text>

  <!-- Base -->
  <rect x="120" y="400" width="740" height="26" rx="5" fill="#2A171B"/>
  <text x="140" y="417" class="p-light">manikin base: matte, dark, the only thing that does not move</text>

  <!-- Beam from the sensor at rest straight down to the base -->
  <path class="beam" d="M700 241 L700 400"/>

  <!-- Plate, pressed (rotated 11.54° about the hinge: 50 mm at the sternum, 65 mm at the sensor) -->
  <g transform="rotate(11.54 180 220)" opacity="0.55">
    <line x1="180" y1="220" x2="720" y2="220" class="plate-pressed"/>
    <rect x="686" y="223" width="28" height="18" rx="3" class="sensor-pressed"/>
  </g>

  <!-- Plate, at rest -->
  <line x1="180" y1="220" x2="720" y2="220" class="plate"/>
  <rect x="686" y="223" width="28" height="18" rx="3" class="sensor"/>
  <circle cx="580" cy="220" r="5.5" fill="#B23A2E"/>
  <circle cx="180" cy="220" r="9" fill="#FFFFFF" stroke="#2A171B" stroke-width="3"/>

  <text x="180" y="252" class="k" text-anchor="middle">hinge</text>
  <text x="200" y="204" class="p">at rest</text>
  <text x="300" y="270" class="p">pressed</text>
  <text x="580" y="204" class="k" text-anchor="middle">sternum, 50 mm compression</text>

  <!-- Chest depth at the sternum -->
  <path class="flow" d="M540 226 L540 286" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="530" y="252" class="lbl" style="text-anchor:end">chest depth</text>
  <text x="530" y="268" class="lbl" style="text-anchor:end">50 mm</text>

  <!-- Compression spring on the base, under the sternum -->
  <path class="spring" d="M580 400 L580 394 L598 388 L562 376 L598 364 L562 352 L598 340 L562 328 L598 316 L562 304 L598 292 L562 280 L598 268 L562 256 L598 244 L562 232 L580 226"/>
  <path class="beam" d="M506 338 L556 340"/>
  <text x="250" y="334" class="k">compression spring under the sternum:</text>
  <text x="250" y="350" class="k">no room for a sensor there</text>

  <!-- Sensor travel -->
  <path class="ext" d="M718 241 L778 241 M712 346 L778 346"/>
  <path class="flow" d="M760 244 L760 343" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="772" y="289" class="lbl" style="text-anchor:start">sensor travel</text>
  <text x="772" y="305" class="lbl" style="text-anchor:start">65 mm</text>

  <!-- Sensor label beside the beam -->
  <text x="712" y="374" class="k">VL53L4CD, beam straight</text>
  <text x="712" y="390" class="k">down to the base</text>

  <!-- Caption -->
  <rect x="540" y="448" width="512" height="80" rx="14" class="box"/>
  <text x="564" y="482" class="k" style="font-size:14px">sensor travel = chest depth × (hinge → sensor) / (hinge → sternum)</text>
  <text x="564" y="508" class="p">1.3 × with the reference mount: 50 mm of chest becomes 65 mm of travel.</text>
</svg>
