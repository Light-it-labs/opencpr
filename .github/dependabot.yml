version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1 and TypeScript 7 ships no compiler API yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1 and TypeScript 7 ships no compiler API yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # BullMQ 6 is built against ioredis 5; ioredis 6 switches to RESP3 by default.
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /admin-portal
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1 and TypeScript 7 ships no compiler API yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
