name: Bug report
description: Something in the kiosk, the API, the admin portal or the firmware does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. …
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Kiosk app
        - API
        - Admin portal
        - Firmware or sensor
        - Booth computer scripts
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove names, emails and any other personal data before posting.
